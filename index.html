
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>광교분원 셔틀 시간표</title>
<style>
  :root{
    --bg:#F7F6F2;
    --card:#FFFFFF;
    --ink:#1C2622;
    --sub:#5B6660;
    --line:#E4E2DA;
    --lake:#1B2A54;
    --lake-dark:#10193A;
    --lake-tint:#E9EAF3;
    --mwf:#22315E;
    --tt:#BD7A26;
    --amber:#E7A93C;
    --amber-tint:#FBF0DC;
    --danger:#C4587A;
    --radius:14px;

    --b1:#4C9A6B; --b1t:#EAF5EE;
    --b2:#3B82C4; --b2t:#E9F2FA;
    --b3:#D69A18; --b3t:#FBF2DE;
    --b5:#D9762A; --b5t:#FBEDDF;
    --b6:#8163C7; --b6t:#F0EAFA;
    --b8:#C4587A; --b8t:#FAE9EE;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Pretendard","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }

  .wrap{max-width:900px;margin:0 auto;padding:0 0 64px;}

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(160deg,var(--lake) 0%,var(--lake-dark) 100%);
    color:#fff;
    padding:28px 20px 22px;
    border-radius:0 0 22px 22px;
    position:relative;
    overflow:hidden;
  }
  header::after{
    content:"";
    position:absolute; right:-40px; top:-60px;
    width:220px; height:220px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    pointer-events:none;
  }
  header::before{
    content:"";
    position:absolute; left:-30px; bottom:-70px;
    width:160px; height:160px; border-radius:50%;
    background:rgba(255,255,255,0.06);
    pointer-events:none;
  }
  .header-top{position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .eyebrow{
    font-size:13px; letter-spacing:.14em; font-weight:700;
    color:rgba(255,255,255,0.75); text-transform:uppercase;
  }
  h1{
    margin:6px 0 4px; font-size:26px; font-weight:800; letter-spacing:-0.01em;
  }
  .updated{
    font-size:13px; color:rgba(255,255,255,0.8);
  }
  .updated b{color:#fff;}

  .notice{
    position:relative;
    margin-top:16px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:12px;
    padding:12px 14px;
    font-size:13px;
    color:#fff;
  }
  .notice p{margin:4px 0;}

  /* ---------- Tabs ---------- */
  nav.tabs{
    display:flex; gap:8px; overflow-x:auto;
    padding:16px 20px 4px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:10px 16px;
    background:var(--card);
    border:2px solid var(--line);
    border-radius:14px;
    cursor:pointer;
    min-width:84px;
    transition:all .15s ease;
    user-select:none;
  }
  .tab .num{font-size:18px; font-weight:800; color:var(--ink);}
  .tab .route{font-size:11px; color:var(--sub); white-space:nowrap;}
  .tab.active{
    border-color:var(--dot,var(--lake));
    background:var(--tint,var(--lake-tint));
    box-shadow:0 3px 10px rgba(0,0,0,0.06);
  }
  .tab.active .num{color:var(--dot,var(--lake));}
  .tab .dotbar{width:26px; height:4px; border-radius:3px; background:var(--dot,var(--lake)); margin-top:2px;}

  /* ---------- Panels ---------- */
  main{padding:16px 20px 0;}
  .panel{display:none;}
  .panel.active{display:block;}

  .card{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    overflow:hidden;
    margin-bottom:16px;
  }
  .card-head{
    padding:16px 18px;
    background:var(--tint,var(--lake-tint));
    border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;
  }
  .bus-title{display:flex; align-items:center; gap:10px;}
  .bus-badge{
    width:44px; height:44px; border-radius:12px;
    background:var(--dot,var(--lake)); color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:800; flex:0 0 auto;
  }
  .bus-title h2{margin:0; font-size:18px; font-weight:800;}
  .bus-title .route-note{font-size:13px; color:var(--sub); margin-top:1px;}
  .driver-call{
    display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line);
    padding:8px 14px; border-radius:999px;
    text-decoration:none; color:var(--ink); font-weight:700; font-size:14px;
    white-space:nowrap;
  }
  .driver-call .call-text{display:flex; flex-direction:column; align-items:flex-start; line-height:1.28;}
  .driver-call .call-name{font-size:11px; font-weight:700; color:var(--sub);}
  .driver-call .call-phone{font-size:14px; font-weight:800; color:var(--ink);}
  .driver-call svg{width:16px; height:16px; fill:var(--dot,var(--lake)); flex:0 0 auto;}

  .tag{
    display:inline-block; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px; margin-top:6px;
    background:var(--amber-tint); color:#8A6110; border:1px solid #EAD6A5;
  }

  .extra-note{
    margin:0; padding:11px 16px;
    background:var(--amber-tint); border-bottom:1px solid #EAD6A5;
    color:#7A5A0E; font-size:13px; font-weight:600;
  }

  /* ---------- Table ---------- */
  .table-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  table{width:100%; border-collapse:separate; border-spacing:0; min-width:640px;}
  thead .grp th{
    text-align:center; font-size:12px; font-weight:800; color:#fff;
    padding:8px 4px;
  }
  thead .grp th.mwf{background:var(--mwf);}
  thead .grp th.tt{background:var(--tt);}
  thead .grp th.stop-col{background:var(--card);}

  thead .sub th{
    text-align:center; font-size:12.5px; font-weight:700; color:var(--ink);
    background:#F1F0EA; padding:8px 4px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  thead .sub th .ct{display:block; font-size:10.5px; font-weight:500; color:var(--sub); margin-top:1px;}
  thead .sub th.stop-col{text-align:left; padding-left:14px;}

  tbody td{
    padding:9px 4px; text-align:center; font-size:15px; font-weight:700;
    border-bottom:1px solid var(--line); color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  tbody td.stop-name{
    text-align:left; padding-left:14px; font-size:13.5px; font-weight:600; color:var(--ink);
    background:var(--card);
  }
  tbody td.stop-name .idx{
    display:inline-flex; align-items:center; justify-content:center;
    width:20px; height:20px; border-radius:50%;
    background:var(--tint,var(--lake-tint)); color:var(--dot,var(--lake));
    font-size:11px; font-weight:800; margin-right:7px; flex:0 0 auto;
  }
  tbody tr:nth-child(even) td{background:#FBFBF9;}
  tbody tr.arrival td{
    background:var(--tint,var(--lake-tint)) !important;
    font-weight:800; color:var(--dot,var(--lake));
    border-top:2px solid var(--dot,var(--lake));
  }
  tbody tr.arrival td.stop-name{color:var(--dot,var(--lake));}

  /* 정차 지역 열을 화면에 고정(엑셀 틀 고정과 동일한 개념) — 나머지 시간 열만 옆으로 스크롤됩니다 */
  th.stop-col, td.stop-name{
    position:sticky; left:0; z-index:2;
    box-shadow:2px 0 6px -2px rgba(0,0,0,0.12);
  }
  thead tr.grp th.stop-col{ z-index:3; }
  thead tr.sub th.stop-col{ z-index:3; }

  @media (max-width:700px){
    table{min-width:0;}
    th.stop-col, tbody td.stop-name{
      width:96px; min-width:96px; max-width:96px;
    }
    tbody td.stop-name{
      white-space:normal; line-height:1.28; font-size:12px; padding:8px 6px 8px 10px;
    }
    tbody td.stop-name .idx{width:17px; height:17px; font-size:9.5px; margin-right:5px;}
    thead .sub th.stop-col{padding-left:10px; font-size:11px;}
    thead .sub th{font-size:11px; padding:6px 3px;}
    thead .sub th .ct{font-size:9.5px;}
    thead .grp th{font-size:10.5px; padding:6px 3px;}
    tbody td{font-size:13px; padding:8px 3px;}
  }

  .col-divider{border-left:2px solid var(--line);}

  /* ---------- Teacher contacts ---------- */
  .contacts{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:14px 16px 16px;
  }
  @media (max-width:520px){ .contacts{grid-template-columns:1fr;} }
  .contact{
    border:1px solid var(--line); border-radius:12px; padding:10px 12px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .contact .label{font-size:12.5px; color:var(--ink); font-weight:800;}
  .contact .name{font-size:14px; font-weight:700; margin-top:1px;}
  .contact a{
    font-size:13px; font-weight:800; color:var(--dot,var(--lake));
    text-decoration:none; border:1.5px solid var(--dot,var(--lake));
    padding:6px 11px; border-radius:999px; white-space:nowrap;
  }

  footer{
    padding:18px 20px 0; text-align:center; color:var(--sub); font-size:12px;
  }
  footer a{display:inline-block; margin-top:5px; font-size:13px;}

  @media print{
    body{background:#fff;}
    nav.tabs{display:none;}
    .panel{display:block !important; page-break-after:always;}
    header{border-radius:0;}
  }
</style>
</head>

let META = {"title":"셔틀버스 시간표","baseDate":"2026년 7월 기준 / 노선 및 탑승시간은 학기별로 변경될 수 있습니다"};

const BUS_COLORS = {
  "1": {dot:"var(--b1)", tint:"var(--b1t)"},
  "2": {dot:"var(--b2)", tint:"var(--b2t)"},
  "3": {dot:"var(--b3)", tint:"var(--b3t)"},
  "5": {dot:"var(--b5)", tint:"var(--b5t)"},
  "6": {dot:"var(--b6)", tint:"var(--b6t)"},
  "8": {dot:"var(--b8)", tint:"var(--b8t)"}
};

function telHref(phone){ return "tel:" + (phone||"").replace(/[^0-9+]/g,""); }

function callIconSvg(){
  return '<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.5 21 3 13.5 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>';
}

let activeIdx = 0;

function renderMeta(){
  document.getElementById("pageTitle").textContent = META.title;
  document.getElementById("baseDate").innerHTML = "<b>" + META.baseDate + "</b>";
}

function renderNotice(){
  const box = document.getElementById("noticeBox");
  box.innerHTML = NOTICE_LINES.filter(l => l.trim().length>0).map(l => `<p>${escapeHtml(l)}</p>`).join("");
}

function escapeHtml(s){
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function buildTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  DATA.forEach((bus, i) => {
    const c = BUS_COLORS[bus.bus_no];
    const tab = document.createElement("div");
    tab.className = "tab" + (i===activeIdx ? " active" : "");
    tab.style.setProperty("--dot", c.dot);
    tab.style.setProperty("--tint", c.tint);
    tab.innerHTML = `<span class="num">${bus.bus_no}호차</span>
                      <span class="route">${bus.route_note.replace(/\[.*?\]/,'').trim()}</span>
                      <span class="dotbar"></span>`;
    tab.addEventListener("click", () => selectTab(i));
    tabsEl.appendChild(tab);
  });
}

function periodGroups(){
  return { mwf: [0,1,2], tt: [3,4] };
}

function buildPanel(bus, idx){
  const c = BUS_COLORS[bus.bus_no];
  const g = periodGroups();
  const noteClean = bus.route_note;

  let extraNoteHtml = bus.extra_note ? `<p class="extra-note">※ ${escapeHtml(bus.extra_note)}</p>` : "";

  let theadSub = `<th class="stop-col">정차 지역</th>`;
  g.mwf.forEach(ci => {
    theadSub += `<th>${bus.period_labels[ci]}<span class="ct">${bus.class_time[ci]}</span></th>`;
  });
  g.tt.forEach((ci,k) => {
    theadSub += `<th${k===0?' class="col-divider"':''}>${bus.period_labels[ci]}<span class="ct">${bus.class_time[ci]}</span></th>`;
  });

  let rows = "";
  bus.stops.forEach((s, si) => {
    let tds = `<td class="stop-name"><span class="idx">${si+1}</span>${escapeHtml(s.name)}</td>`;
    g.mwf.forEach(ci => { tds += `<td>${s.times[ci]}</td>`; });
    g.tt.forEach((ci,k) => { tds += `<td${k===0?' class="col-divider"':''}>${s.times[ci]}</td>`; });
    rows += `<tr>${tds}</tr>`;
  });

  let arrTds = `<td class="stop-name">학원 도착</td>`;
  g.mwf.forEach(ci => { arrTds += `<td>${bus.arrival[ci]}</td>`; });
  g.tt.forEach((ci,k) => { arrTds += `<td${k===0?' class="col-divider"':''}>${bus.arrival[ci]}</td>`; });

  const mwfContact = bus.mwf_teacher_phone ? `
    <div class="contact">
      <div class="label">월·수·금 안전 선생님</div>
      <a href="${telHref(bus.mwf_teacher_phone)}">${escapeHtml(bus.mwf_teacher_phone)}</a>
    </div>` : "";
  const ttContact = bus.tt_teacher_phone ? `
    <div class="contact">
      <div class="label">화·목 안전 선생님</div>
      <a href="${telHref(bus.tt_teacher_phone)}">${escapeHtml(bus.tt_teacher_phone)}</a>
    </div>` : "";

  return `
  <div class="panel${idx===activeIdx?' active':''}" id="panel-${idx}" style="--dot:${c.dot};--tint:${c.tint}">
    <div class="card">
      <div class="card-head" style="--tint:${c.tint}">
        <div class="bus-title">
          <div class="bus-badge" style="--dot:${c.dot}">${bus.bus_no}</div>
          <div>
            <h2>${bus.bus_no}호차</h2>
            <div class="route-note">${noteClean}</div>
          </div>
        </div>
        ${bus.driver_phone ? `<a class="driver-call" href="${telHref(bus.driver_phone)}" style="--dot:${c.dot}">${callIconSvg()}<span class="call-text">${bus.driver_name ? `<span class="call-name">${escapeHtml(bus.driver_name)}</span>` : ""}<span class="call-phone">${escapeHtml(bus.driver_phone)}</span></span></a>` : ""}
      </div>
      ${extraNoteHtml}
      <div class="table-scroll">
        <table style="--dot:${c.dot};--tint:${c.tint}">
          <thead>
            <tr class="grp">
              <th class="stop-col"></th>
              <th class="mwf" colspan="${g.mwf.length}">월 · 수 · 금</th>
              <th class="tt" colspan="${g.tt.length}">화 · 목</th>
            </tr>
            <tr class="sub">${theadSub}</tr>
          </thead>
          <tbody>
            ${rows}
            <tr class="arrival">${arrTds}</tr>
          </tbody>
        </table>
      </div>
      ${(mwfContact || ttContact) ? `<div class="contacts">${mwfContact}${ttContact}</div>` : ""}
    </div>
  </div>`;
}

function renderPanels(){
  document.getElementById("panels").innerHTML = DATA.map(buildPanel).join("");
}

function selectTab(i){
  activeIdx = i;
  document.querySelectorAll(".tab").forEach((t,idx)=>t.classList.toggle("active", idx===i));
  document.querySelectorAll(".panel").forEach((p,idx)=>p.classList.toggle("active", idx===i));
}

function renderAll(){
  renderMeta();
  renderNotice();
  buildTabs();
  renderPanels();
}

renderAll();
</script>
</body>
</html>
